name: Build SiteWatch app

on:
  push:
    paths: ['sitewatch-app/**', '.github/workflows/build-sitewatch.yml']
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: dist:win
            artifact: SiteWatch-Windows
            files: sitewatch-app/dist/*.exe
          - os: macos-latest
            script: dist
            artifact: SiteWatch-Mac
            files: sitewatch-app/dist/*.dmg
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: sitewatch-app
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm test
      - run: npm run ${{ matrix.script }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.files }}
